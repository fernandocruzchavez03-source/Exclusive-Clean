<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de fotos | Autolavado</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #f0f5fa;
      color: #172b40;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      width: min(100% - 2rem, 42rem);
      margin: 2rem auto;
    }

    h1, h2, h3, p { margin-top: 0; }

    section, article {
      background: white;
      border: 1px solid #cdd9e5;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    article { background: #f7fafc; }

    form, label {
      display: grid;
      gap: .5rem;
    }

    form { margin-bottom: 1rem; }
    button, input { font: inherit; }

    input, button {
      min-height: 44px;
      max-width: 100%;
      border-radius: .5rem;
      padding: .55rem .75rem;
    }

    input {
      width: 100%;
      border: 1px solid #74879a;
      background: white;
    }

    button {
      border: 0;
      background: #0755a0;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: #e3ecf5;
      color: #172b40;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    header, .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      justify-content: space-between;
    }

    #mensaje { overflow-wrap: anywhere; }
    [data-error="true"] { color: #a12721; }
    body { background: #101220; color: #f8f8fc; color-scheme: dark; }
    h1 { font-size: clamp(1.65rem, 5vw, 2.5rem); margin-bottom: 0; }
    .marca { color: #fed505; font-weight: 800; margin-bottom: .25rem; }
    section, article { background: #1c1e30; border-color: #42465b; padding: clamp(1rem, 3vw, 1.5rem); }
    article { background: #25283b; }
    input { background: #101220; color: #fff; }
    button { background: #fed505; color: #101220; min-height: 48px; }
    button.secondary { background: #373b52; color: #fff; }
    [data-error="true"] { color: #ffb3ad; }
    :focus-visible { outline: 2px solid #fed505; outline-offset: 3px; }
    .par { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .par label { min-width: 0; border: 1px dashed #85899e; border-radius: .75rem; padding: .75rem; }
    .par img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #101220; border-radius: .5rem; }
    @media (max-width: 560px) { .par { grid-template-columns: 1fr; } }

    textarea { width: 100%; font: inherit; padding: .65rem; border-radius: .65rem; border: 1px solid #85899e; background: #101220; color: #fff; resize: vertical; }
    button.peligro { background: #532832; color: #ffe4e7; margin: .5rem; }
    #trabajos article > div { margin-top: .75rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="marca">Exclusive Clean</p><h1>Panel de fotos</h1></div>
      <button id="salir" class="secondary" type="button" hidden>
        Cerrar sesión
      </button>
    </header>

    <p id="mensaje" role="status" aria-live="polite">Cargando panel…</p>

    <section id="acceso" hidden>
      <h2>Inicia sesión</h2>
      <form id="login">
        <label>
          Correo
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>
          Contraseña
          <input name="password" type="password"
                 autocomplete="current-password" required>
        </label>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <div id="panel" hidden>
      <section>
        <h2>Nuevo trabajo</h2>
        <form id="nuevo">
          <label>
            Título
            <input name="titulo" maxlength="100" required
                   placeholder="Ej. Lavado interior y exterior">
          </label>
          <label>
            Nota privada (opcional)
            <textarea id="nueva-nota" rows="3" maxlength="2000"
              placeholder="Ej. Mazda 3 blanco · 4 de noviembre · lavado interior"></textarea>
          </label>
          <div class="par">
            <label>Foto Antes<input id="lote-antes" type="file" accept="image/*"><img alt="Vista previa Antes" hidden></label>
            <label>Foto Después<input id="lote-despues" type="file" accept="image/*"><img alt="Vista previa Después" hidden></label>
          </div>
          <p>Elige las fotos de tu galería o tómalas con la cámara. Ajustamos el tamaño al subirlas.</p>
          <button type="submit" value="publicar">Subir y publicar</button>
          <button type="submit" class="secondary">Guardar borrador</button>
        </form>

      </section>

      <section>
        <div class="acciones">
          <h2>Trabajos</h2>
          <button id="actualizar" class="secondary" type="button">Actualizar lista</button>
        </div>
        <div id="trabajos"></div>
        <button id="mas" class="secondary" type="button" hidden>Ver más trabajos</button>
      </section>
    </div>
  </main>

  <script type="module">
    // Sustituye estos dos valores por los de tu proyecto.
    const SUPABASE_URL = 'https://qmugvqcdxcfjfcbzgcdy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rIMAan9OLpuCvDWDyVIpXg_g8AQ-ipy';

    const tabla = 'autolavado_trabajos';
    const limite = 20;
    const maxBytes = 5 * 1024 * 1024;
    const $ = (id) => document.getElementById(id);

    let db;
    let fotos;
    let pagina = 0;

    function mensaje(texto, esError = false) {
      $('mensaje').textContent = texto;
      $('mensaje').dataset.error = String(esError);
    }

    function resultado({ data, error }) {
      if (error) throw error;
      return data;
    }

    async function ejecutar(boton, texto, tarea) {
      if (boton.disabled) return;
      boton.disabled = true;
      mensaje(texto);

      try {
        await tarea();
      } catch (error) {
        mensaje(error.message || 'Ocurrió un error. Intenta de nuevo.', true);
      } finally {
        boton.disabled = false;
      }
    }

    function elemento(etiqueta, texto) {
      const nodo = document.createElement(etiqueta);
      if (texto) nodo.textContent = texto;
      return nodo;
    }

    function boton(texto) {
      const nodo = elemento('button', texto);
      nodo.type = 'button';
      return nodo;
    }

    async function mostrarSesion(sesion) {
      $('panel').hidden = true;
      $('acceso').hidden = Boolean(sesion);
      $('salir').hidden = !sesion;
      $('trabajos').replaceChildren();
      $('mas').hidden = true;

      if (!sesion) {
        mensaje('Ingresa con tu cuenta de administrador.');
        return;
      }

      const admin = resultado(await db.from('autolavado_admins')
        .select('user_id')
        .eq('user_id', sesion.user.id)
        .maybeSingle());

      if (!admin) {
        mensaje('Esta cuenta no tiene acceso al panel.', true);
        return;
      }

      $('panel').hidden = false;
      await cargarTrabajos();
      mensaje('Sesión iniciada.');
    }

    async function cargarTrabajos({ agregar = false } = {}) {
      const siguientePagina = agregar ? pagina + 1 : 0;
      const inicio = siguientePagina * limite;
      const filas = resultado(await db.from(tabla)
        .select('id,titulo,publicado,eliminando')
        .order('creado_en', { ascending: false })
        .order('id', { ascending: false })
        .range(inicio, inicio + limite - 1));

      pagina = siguientePagina;
      if (!agregar) $('trabajos').replaceChildren();
      if (!agregar && filas.length === 0) {
        $('trabajos').append(elemento('p', 'Todavía no hay trabajos.'));
      }

      for (const trabajo of filas) {
        $('trabajos').append(tarjeta(trabajo));
      }

      $('mas').hidden = filas.length < limite;
    }

    const tablaNotas = 'autolavado_notas';

    async function guardarNota(id, nota) {
      resultado(await db.from(tablaNotas).upsert({ trabajo_id: id, nota }));
    }

    async function formularioNota(id) {
      const registro = resultado(await db.from(tablaNotas).select('nota')
        .eq('trabajo_id', id).maybeSingle());
      const form = elemento('form');
      const label = elemento('label', 'Nota privada');
      const campo = elemento('textarea');
      campo.rows = 3;
      campo.maxLength = 2000;
      campo.placeholder = 'Ej. Mazda 3 blanco · 4 de noviembre · lavado interior';
      campo.value = registro?.nota ?? '';
      const guardar = elemento('button', 'Guardar nota');
      guardar.type = 'submit';
      guardar.className = 'secondary';
      label.append(campo);
      form.append(label, guardar);
      form.addEventListener('submit', event => {
        event.preventDefault();
        ejecutar(guardar, 'Guardando nota…', async () => {
          await guardarNota(id, campo.value.trim());
          mensaje('Nota privada guardada.');
        });
      });
      return form;
    }

    function botonBorrar(trabajo) {
      const borrar = boton(trabajo.eliminando ? 'Reintentar borrado' : 'Borrar trabajo');
      borrar.className = 'peligro';
      borrar.addEventListener('click', () => {
        if (!confirm('¿Borrar este trabajo, sus fotos y su nota privada? Esta acción es permanente.')) return;
        ejecutar(borrar, 'Borrando trabajo y fotos…', async () => {
          resultado(await db.from(tabla).update({ publicado: false, eliminando: true })
            .eq('id', trabajo.id).select('id').single());

          try {
            resultado(await fotos.remove([
              trabajo.id + '/antes.jpg',
              trabajo.id + '/despues.jpg'
            ]));
            resultado(await db.from(tabla).delete().eq('id', trabajo.id)
              .select('id').single());
          } catch (error) {
            await cargarTrabajos().catch(console.error);
            throw new Error('El trabajo quedó oculto. Pulsa Reintentar borrado. ' + error.message);
          }

          await cargarTrabajos().catch(console.error);
          mensaje('Trabajo, fotos y nota eliminados.');
        });
      });
      return borrar;
    }


    function tarjeta(trabajo) {
      const tarjeta = elemento('article');
      const estado = trabajo.eliminando ? 'Borrado pendiente' : (trabajo.publicado ? 'Publicado' : 'Borrador u oculto');
      const abrir = boton('Abrir trabajo');
      const detalle = elemento('div');
      detalle.hidden = true;

      tarjeta.append(elemento('h3', trabajo.titulo), elemento('p', estado));
      if (!trabajo.eliminando) tarjeta.append(abrir);
      tarjeta.append(botonBorrar(trabajo), detalle);

      abrir.addEventListener('click', () => ejecutar(abrir, 'Cargando fotos…', async () => {
        await cargarDetalle(trabajo, detalle);
        detalle.hidden = false;
        abrir.textContent = 'Actualizar fotos';
        mensaje(`Trabajo abierto: ${trabajo.titulo}`);
      }));

      return tarjeta;
    }

    function formularioTitulo(trabajo) {
      const form = elemento('form');
      const label = elemento('label', 'Título público');
      const campo = elemento('input');
      campo.value = trabajo.titulo;
      campo.maxLength = 100;
      campo.required = true;
      const guardar = elemento('button', 'Guardar título');
      guardar.type = 'submit';
      guardar.className = 'secondary';
      label.append(campo);
      form.append(label, guardar);
      form.addEventListener('submit', event => {
        event.preventDefault();
        ejecutar(guardar, 'Guardando título…', async () => {
          const titulo = campo.value.trim();
          if (!titulo) throw new Error('Escribe un título.');
          resultado(await db.from(tabla).update({ titulo }).eq('id', trabajo.id)
            .select('id').single());
          trabajo.titulo = titulo;
          form.closest('article').querySelector('h3').textContent = titulo;
          mensaje('Título actualizado.');
        });
      });
      return form;
    }


    async function cargarDetalle(trabajo, detalle) {
      const archivos = resultado(await fotos.list(trabajo.id));
      const nombres = new Set(archivos.map((archivo) => archivo.name));

      detalle.replaceChildren(formularioTitulo(trabajo), await formularioNota(trabajo.id));
      if (trabajo.publicado) {
        detalle.append(elemento('p', 'Para reemplazar una foto, oculta el trabajo y vuelve a abrirlo.'));
      }

      for (const [etiqueta, nombre] of [
        ['Antes', 'antes.jpg'],
        ['Después', 'despues.jpg']
      ]) {
        if (nombres.has(nombre)) {
          detalle.append(elemento('p', `${etiqueta}: foto guardada.`));
        }
        if (!trabajo.publicado) {
          detalle.append(formularioFoto(trabajo, detalle, etiqueta, nombre, nombres.has(nombre)));
        }
      }

      if (!trabajo.publicado && nombres.size === 0) {
        detalle.append(elemento('p', 'Selecciona una imagen JPG de hasta 5 MB por foto.'));
      }

      const publicar = !trabajo.publicado;
      const cambiar = boton(publicar ? 'Publicar trabajo' : 'Ocultar trabajo');
      cambiar.disabled = publicar && !(nombres.has('antes.jpg') && nombres.has('despues.jpg'));

      cambiar.addEventListener('click', () => ejecutar(cambiar, 'Guardando cambio…', async () => {
        resultado(await db.from(tabla)
          .update({ publicado: publicar })
          .eq('id', trabajo.id)
          .select('id')
          .single());

        mensaje(publicar ? 'Trabajo publicado.' : 'Trabajo ocultado.');
        await cargarTrabajos();
      }));

      detalle.append(cambiar);
    }

    function formularioFoto(trabajo, detalle, etiqueta, nombre, reemplazar) {
      const form = elemento('form');
      const label = elemento('label', `Foto ${etiqueta}`);
      const input = elemento('input');
      const subir = elemento('button', `${reemplazar ? 'Reemplazar' : 'Subir'} foto ${etiqueta}`);

      input.type = 'file';
      input.accept = 'image/*';
      input.required = true;
      subir.type = 'submit';

      label.append(input);
      form.append(label, subir);

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        ejecutar(subir, `Subiendo foto ${etiqueta}…`, async () => {
          const archivo = input.files[0];
          if (!archivo) throw new Error('Selecciona una foto.');
          const jpg = await prepararFoto(archivo);
          resultado(await fotos.upload(`${trabajo.id}/${nombre}`, jpg, {
            contentType: 'image/jpeg',
            upsert: reemplazar,
            cacheControl: '60'
          }));

          await cargarDetalle(trabajo, detalle);
          mensaje(`Foto ${etiqueta} guardada.`);
        });
      });

      return form;
    }

    $('login').addEventListener('submit', (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const datos = new FormData(form);

      ejecutar(event.submitter, 'Iniciando sesión…', async () => {
        const { session } = resultado(await db.auth.signInWithPassword({
          email: String(datos.get('email')).trim(),
          password: String(datos.get('password'))
        }));

        form.reset();
        await mostrarSesion(session);
      });
    });

    $('salir').addEventListener('click', () => ejecutar(
      $('salir'), 'Cerrando sesión…', async () => {
        resultado(await db.auth.signOut({ scope: 'local' }));
        limpiarNuevo();
        await mostrarSesion(null);
      }
    ));

    const campos = [
      [$('lote-antes'), 'antes.jpg', 'Antes'],
      [$('lote-despues'), 'despues.jpg', 'Después']
    ];

    function vista(input) {
      const imagen = input.nextElementSibling;
      if (imagen.src.startsWith('blob:')) URL.revokeObjectURL(imagen.src);
      imagen.removeAttribute('src');
      imagen.hidden = !input.files.length;
      if (!imagen.hidden) imagen.src = URL.createObjectURL(input.files[0]);
    }

    for (const [input] of campos) {
      input.addEventListener('change', () => vista(input));
    }

    function limpiarNuevo() {
      $('nuevo').reset();
      for (const [input] of campos) vista(input);
    }

    async function prepararFoto(archivo) {
      const url = URL.createObjectURL(archivo);
      try {
        const imagen = new Image();
        imagen.src = url;
        await imagen.decode().catch(() => {
          throw new Error('Tu navegador no pudo abrir la foto. Elige una copia JPG o PNG.');
        });
        const escala = Math.min(1, 1600 / Math.max(imagen.naturalWidth, imagen.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
        canvas.height = Math.max(1, Math.round(imagen.naturalHeight * escala));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(imagen, 0, 0, canvas.width, canvas.height);
        const jpg = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .85));
        if (!jpg || jpg.size > maxBytes) throw new Error('No se pudo ajustar el tamaño de la foto.');
        return jpg;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    $('nuevo').addEventListener('submit', (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const titulo = String(new FormData(form).get('titulo')).trim();
      const publicar = event.submitter.value === 'publicar';
      const nota = $('nueva-nota').value.trim();
      const elegidas = campos.map(([input, nombre, etiqueta]) => ({
        archivo: input.files[0], nombre, etiqueta
      }));

      ejecutar(event.submitter, 'Preparando trabajo…', async () => {
        if (!titulo) throw new Error('Escribe un título para el trabajo.');
        if (publicar && elegidas.some(({ archivo }) => !archivo)) {
          throw new Error('Elige las dos fotos o pulsa Guardar borrador.');
        }

        form.inert = true;
        $('salir').disabled = true;
        try {
          const preparadas = [];
          for (const foto of elegidas) {
            if (foto.archivo) preparadas.push({ ...foto, jpg: await prepararFoto(foto.archivo) });
          }

          const { id } = resultado(await db.from(tabla).insert({ titulo }).select('id').single());
          try {
            if (nota) await guardarNota(id, nota);
            for (const { nombre, etiqueta, jpg } of preparadas) {
              mensaje('Subiendo foto ' + etiqueta + '…');
              resultado(await fotos.upload(id + '/' + nombre, jpg, {
                contentType: 'image/jpeg', upsert: false
              }));
            }
            if (publicar) {
              mensaje('Publicando trabajo…');
              resultado(await db.from(tabla).update({ publicado: true }).eq('id', id)
                .select('id').single());
            }
          } catch (error) {
            limpiarNuevo();
            await cargarTrabajos().catch(console.error);
            throw new Error('El trabajo quedó guardado. Ábrelo en la lista para continuar. ' + error.message);
          }

          limpiarNuevo();
          await cargarTrabajos().catch(console.error);
          mensaje(publicar ? 'Trabajo publicado en la galería.' : 'Borrador guardado.');
        } finally {
          form.inert = false;
          $('salir').disabled = false;
        }
      });
    });


    $('actualizar').addEventListener('click', () => ejecutar(
      $('actualizar'), 'Actualizando lista…', async () => {
        await cargarTrabajos();
        mensaje('Lista actualizada.');
      }
    ));

    $('mas').addEventListener('click', () => ejecutar(
      $('mas'), 'Cargando más trabajos…', async () => {
        await cargarTrabajos({ agregar: true });
        mensaje('Lista actualizada.');
      }
    ));

    try {
      if (SUPABASE_URL.includes('TU-PROYECTO') || SUPABASE_KEY.includes('TU_CLAVE')) {
        throw new Error('Edita admin.html y coloca la URL y la clave pública de Supabase.');
      }

      const { createClient } = await import(
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm'
      );

      db = createClient(SUPABASE_URL, SUPABASE_KEY);
      fotos = db.storage.from('autolavado-fotos');

      const { session } = resultado(await db.auth.getSession());
      await mostrarSesion(session);
    } catch (error) {
      mensaje(error.message || 'No se pudo cargar el panel.', true);
    }
  </script>
</body>
</html>
